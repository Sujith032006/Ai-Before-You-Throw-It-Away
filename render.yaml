services:
  - type: web
    name: ai-before-you-throw-it-away-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        value: https://ai-before-you-throw-it-away.netlify.app
      - key: AI_MODE
        value: real
      - key: RFDETR_MODEL
        value: rtdetr-l.pt
      - key: HIGH_CONFIDENCE_THRESHOLD
        value: "0.80"
      - key: LOW_CONFIDENCE_THRESHOLD
        value: "0.50"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: LLM_MODE
        value: real
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: DATABASE_URL
        sync: false
