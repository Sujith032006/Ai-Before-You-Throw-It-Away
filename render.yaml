services:
  - type: web
    name: ai-before-you-throw-it-away-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        value: https://ai-before-you-throw-it-away.netlify.app
      - key: AI_MODE
        value: real
      - key: YOLO_MODEL
        value: yolo11n.pt
      - key: YOLO_CONFIDENCE_THRESHOLD
        value: "0.40"
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: LLM_MODE
        value: mock
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: DATABASE_URL
        sync: false
